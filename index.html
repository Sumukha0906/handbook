## Environment and tooling | Week 1
- Install Python 3.12+ and understand interpreter vs REPL :: python --version, running .py files, the interactive shell, python -m

- Editor setup :: VS Code, Python extension, Pylance, selecting interpreter, integrated terminal
- Debugger :: breakpoints, step over / into / out, watch variables, conditional breakpoints
  > Write a loop with an off-by-one bug and find it only using the debugger
- Code style :: PEP 8 naming, Ruff for lint + format, if __name__ == "__main__" and why it exists

## Core syntax and data types | Week 1
- Variables and dynamic typing :: names are references, id(), is vs ==, type(), isinstance()
- Numbers :: int (unbounded), float precision (0.1 + 0.2), round(), Decimal for money, math module basics
- Booleans and None :: truthiness rules (empty containers, 0, "", None are falsy), None checks with is
- Operators :: arithmetic, comparison chaining (1 < x < 5), logical short-circuit, membership (in), walrus :=
- Strings: basics :: indexing, negative indexing, slicing [a:b:step], immutability, escape chars, raw strings, multi-line strings
- String methods :: split, join, strip, replace, find/index, startswith/endswith, upper/lower/title, isdigit/isalpha, count, zfill
- f-strings and formatting :: {x:.2f}, {x:>10}, {x:,}, {x!r}, {x=} debugging
- Input and output :: input(), type conversion, print(sep=, end=)
  > Temperature converter (C to F and back) with input validation
  > Reverse a string three ways (slicing, loop, reversed + join)
  > Palindrome check ignoring case, spaces and punctuation
  > Count vowels, consonants, digits and spaces in a sentence
  > Print a formatted invoice line: item, qty, price, total aligned in columns

## Control flow | Week 1
- Conditionals :: if / elif / else, nested conditions, ternary expression (a if cond else b)
- Pattern matching :: match-case with literals, OR patterns, guards, capture patterns, matching dicts/tuples
- Loops :: for over sequences, range(start, stop, step), while, break, continue, for-else / while-else
- Looping helpers :: enumerate, zip, reversed, sorted, any, all, sum, min/max with key
  > FizzBuzz, then FizzBuzz with a configurable rules dict
  > Prime check, then all primes up to N (Sieve of Eratosthenes)
  > Fibonacci iteratively, first N terms and Nth term

## Collections and complexity | Week 2
- list :: append, extend, insert, pop, remove, index, count, sort vs sorted, key=, reverse, slicing copies
- Copying :: aliasing, shallow copy (list(), [:], copy()), deep copy (copy.deepcopy), the [[0]*3]*3 trap
- tuple :: immutability, packing / unpacking, starred unpacking (first, *rest), swapping, tuples as dict keys
- dict :: get, setdefault, keys/values/items, update, pop, | merge, insertion order, dict from zip
- set :: add, discard, union, intersection, difference, symmetric difference, frozenset, O(1) membership
- collections module :: Counter (most_common), defaultdict, deque (appendleft, popleft, maxlen), namedtuple, OrderedDict (move_to_end)
- Comprehensions :: list / dict / set comprehensions, with conditions, nested, generator expressions
- Time complexity of built-ins :: list append O(1), insert(0) O(n), x in list O(n) vs x in set O(1), dict ops O(1) average, sort O(n log n)
  > Word frequency counter for a paragraph (dict, then Counter)
  > Remove duplicates from a list while preserving order

  > Merge two dicts summing values for common keys
  > Transpose a matrix with a comprehension

## Functions | Week 2 to 3
- Defining functions :: def, return, returning multiple values (tuple), None return, docstrings
- Arguments :: positional vs keyword, defaults, mutable default argument pitfall and the None fix
- Flexible signatures :: *args, **kwargs, keyword-only (after *), positional-only (before /), unpacking into calls
- Scope :: LEGB rule, global, nonlocal, why globals hurt testability
- Functions as values :: first-class functions, passing functions, lambda, map / filter / functools.reduce, sorted(key=)
- Closures :: capturing variables, late binding in loops
- Recursion :: base case, recursive case, call stack, recursion limit, when to prefer iteration
- Function type hints :: parameter and return annotations

## Object-oriented programming in Python | Week 4 to 5
- Classes and objects :: class, __init__, self, instance vs class attributes, object identity
- Method types :: instance methods, @classmethod (alternate constructors like from_dict), @staticmethod (utility that belongs to the class)
- Encapsulation :: _protected convention, __private name mangling, @property getter / setter / deleter for validation

- Enum :: Enum, IntEnum, StrEnum, auto(), iterating members, value vs name. Use when a value can only be one of a fixed set (status, role, type) to replace magic strings

(function(){
"use strict";
const LS_KEY = "fde-handbook-progress-v1";

function hash(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return (h>>>0).toString(36);}

function parse(rm){
  const secs=[]; let sec=null, item=null;
  rm.text.split("\n").forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    if(line.startsWith("## ")||line.startsWith("!! ")){
      const isProj=line.startsWith("!!");
      const [title,meta]=line.slice(3).split(" | ");
      sec={type:isProj?"proj":"sec",title:title.trim(),meta:(meta||"").trim(),items:[],id:rm.key+"-s"+hash(line)};
      secs.push(sec); item=null; return;
    }
    if(!sec) return;
    if(line.startsWith("- ")){
      const body=line.slice(2); const i=body.indexOf(" :: ");
      item={title:i<0?body:body.slice(0,i),det:i<0?"":body.slice(i+4),practice:[],id:rm.key+"-"+hash(sec.title+"|"+body)};
      sec.items.push(item); return;
    }
    if(line.startsWith("> ")){
      const t=line.slice(2);
      if(!item){item={title:"Practice",det:"",practice:[],id:rm.key+"-"+hash(sec.title+"|practice")};sec.items.push(item);}
      item.practice.push({t,id:rm.key+"-p"+hash(sec.title+"|"+item.title+"|"+t)}); return;
    }
    if(line.startsWith("* ")){
      const t=line.slice(2);
      sec.items.push({title:t,det:"",practice:[],id:rm.key+"-d"+hash(sec.title+"|"+t),deliverable:true}); return;
    }
  });
  return secs;
}

const data = ROADMAPS.map(rm=>({...rm,secs:parse(rm)}));
function idsOfSec(s){const out=[];s.items.forEach(it=>{out.push(it.id);it.practice.forEach(p=>out.push(p.id));});return out;}
function idsOfRm(rm){return rm.secs.flatMap(idsOfSec);}

// ---------- state ----------
let state={checked:{},t:0};
try{const s=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(s&&s.checked) state=s;}catch(e){}
let doc=null, syncMode="local", saveTimer=null, downloads=null;
try{ if(window.claude&&window.claude.use) window.claude.use("downloads").then(d=>{downloads=d;}).catch(()=>{}); }catch(e){}

function persistLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function scheduleRemote(){
  if(!doc) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await doc.set({checked:state.checked,t:state.t}); setSync("account");}
    catch(e){ if(e&&e.code==="unavailable"){setTimeout(scheduleRemote,1500);} else {setSync("local");} }
  },700);
}
function isDone(id){return !!state.checked[id];}
function toggle(id,val){
  if(val) state.checked[id]=1; else delete state.checked[id];
  state.t=Date.now(); persistLocal(); scheduleRemote(); refreshCounts();
}
function setSync(m){syncMode=m; document.querySelectorAll(".sync").forEach(el=>el.textContent=m==="account"?"Progress saved to your account":"Progress saved on this device");}

async function initRemote(){
  try{
    if(!window.claude||!window.claude.use) return;
    const db=await window.claude.use("db"); if(!db) return;
    doc=db.doc("progress/main");
    const snap=await doc.get();
    if(snap.exists){
      const r=snap.data()||{};
      if((r.t||0)>=(state.t||0)){state={checked:{...(r.checked||{})},t:r.t||0};persistLocal();render();}
      else scheduleRemote();
    } else if(Object.keys(state.checked).length){ scheduleRemote(); }
    setSync("account");
  }catch(e){ doc=null; setSync("local"); }
}

// ---------- rendering ----------
const tabsEl=document.getElementById("tabs"), view=document.getElementById("view");
let current="plan", hideDone=false;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pctOf(ids){if(!ids.length) return 0;return Math.round(ids.filter(isDone).length*100/ids.length);}

function renderTabs(){
  const list=[{key:"plan",name:"Plan"}].concat(data.map(r=>({key:r.key,name:r.name})));
  tabsEl.innerHTML=list.map(t=>{
    const p=t.key==="plan"?"":`<span class="pct" data-tabpct="${t.key}"></span>`;
    return `<button role="tab" aria-selected="${t.key===current}" data-tab="${t.key}">${esc(t.name)}${p}</button>`;
  }).join("");
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;current=b.dataset.tab;render();window.scrollTo({top:0});});

function itemHTML(it){
  const pr=it.practice.length?`<div class="plabel">Practice programs</div><ul class="prac">${it.practice.map(p=>`<li data-pid="${p.id}"><label class="chk"><input type="checkbox" data-id="${p.id}" ${isDone(p.id)?"checked":""}><span class="ptxt">${esc(p.t)}</span></label></li>`).join("")}</ul>`:"";
  return `<li class="item" data-item="${it.id}"><label class="chk"><input type="checkbox" data-id="${it.id}" ${isDone(it.id)?"checked":""}><span><span class="ttl">${esc(it.title)}</span>${it.det?`<span class="det">${esc(it.det)}</span>`:""}</span></label>${pr}</li>`;
}

function renderRoadmap(rm){
  const firstOpen=rm.secs.findIndex(s=>s.type==="sec"&&pctOf(idsOfSec(s))<100);
  let n=0;
  const body=rm.secs.map((s,idx)=>{
    if(s.type==="proj"){
      return `<div class="proj" data-sec="${s.id}"><h4>${esc(s.title)}</h4><div class="uses">Uses: ${esc(s.meta)}</div><ul>${s.items.map(it=>`<li data-pid="${it.id}"><label class="chk"><input type="checkbox" data-id="${it.id}" ${isDone(it.id)?"checked":""}><span class="ttl">${esc(it.title)}</span></label></li>`).join("")}</ul></div>`;
    }
    n++;
    return `<details class="sec" data-sec="${s.id}" ${idx===firstOpen?"open":""}><summary><span class="secno">${String(n).padStart(2,"0")}</span><span class="sectitle"><span class="chev" aria-hidden="true">›</span>${esc(s.title)}<span class="secmeta">${esc(s.meta)}</span></span><span class="secprog" data-secprog="${s.id}"></span><span class="bar minibar"><i data-secbar="${s.id}"></i></span></summary><div class="body"><ul class="items">${s.items.map(itemHTML).join("")}</ul></div></details>`;
  }).join("");
  view.innerHTML=`<section class="hero"><div><h2>${esc(rm.title)}</h2><div class="sub">${esc(rm.sub)}</div></div><div class="count"><span class="big" data-rmdone="${rm.key}">0</span><span class="of"> / ${idsOfRm(rm).length}</span></div><div class="bar"><i data-rmbar="${rm.key}"></i></div></section>
  <div class="tools"><button class="tbtn" data-act="expand">Expand all</button><button class="tbtn" data-act="collapse">Collapse all</button><button class="tbtn" data-act="hide" aria-pressed="${hideDone}">Hide completed</button><span class="sync"></span></div>
  <div class="${hideDone?"hide-done":""}" id="rmbody">${body}</div>`;
}

function renderPlan(){
  const cards=data.map(r=>`<button class="ov" data-go="${r.key}"><b>${esc(r.name)}</b><span data-ovtxt="${r.key}"></span><span class="bar"><i data-rmbar="${r.key}"></i></span></button>`).join("");
  view.innerHTML=`<section class="hero"><div><h2>Your 6 to 8 month plan</h2><div class="sub">Roadmaps run in parallel. This table says which sections of each roadmap to finish each month. Tap a card to open that roadmap.</div></div><div class="count"><span class="big" data-alldone>0</span><span class="of">%</span></div><div class="bar"><i data-allbar></i></div></section>
  <div class="tools"><button class="tbtn" data-act="export">Export progress</button><button class="tbtn" data-act="import">Import progress</button><span class="sync"></span></div>

  <div class="overall">${cards}</div>

  <tr><td>1</td><td>01 to 06 + mini project 1</td><td>01 to 04</td><td>none yet</td><td>01 to 04</td><td>01 to 02</td><td>01</td></tr>
  <tr><td>2</td><td>07 to 10 + mini project 2</td><td>05 to 07</td><td>01 to 02</td><td>05 to 07</td><td>03</td><td>none</td></tr>
  <tr><td>3</td><td>11 to 14 + Project A</td><td>08 to 10</td><td>03 to 05</td><td>08 to 10 + Project A on GCP</td><td>04 to 05</td><td>none</td></tr>

  <tr><td>5</td><td>Revise</td><td>14 to 16</td><td>10 to 13 + portfolio</td><td>Revise</td><td>07 + Project C</td><td>04 to 07</td></tr>

function refreshCounts(){
  let all=[];
  data.forEach(rm=>{
    const ids=idsOfRm(rm); all=all.concat(ids);
    const done=ids.filter(isDone).length, p=pctOf(ids);
    document.querySelectorAll(`[data-tabpct="${rm.key}"]`).forEach(el=>el.textContent=p+"%");
    document.querySelectorAll(`[data-rmbar="${rm.key}"]`).forEach(el=>el.style.width=p+"%");
    document.querySelectorAll(`[data-rmdone="${rm.key}"]`).forEach(el=>el.textContent=done);
    document.querySelectorAll(`[data-ovtxt="${rm.key}"]`).forEach(el=>el.textContent=`${done} of ${ids.length} · ${p}%`);
    rm.secs.forEach(s=>{
      const sid=idsOfSec(s), d=sid.filter(isDone).length;
      const pe=document.querySelector(`[data-secprog="${s.id}"]`); if(pe) pe.textContent=`${d}/${sid.length}`;
      const be=document.querySelector(`[data-secbar="${s.id}"]`); if(be) be.style.width=pctOf(sid)+"%";
      const se=document.querySelector(`[data-sec="${s.id}"]`); if(se) se.classList.toggle("done-sec",d===sid.length);
      s.items.forEach(it=>{
        const li=document.querySelector(`[data-item="${it.id}"]`);
        if(li){li.classList.toggle("all-done",[it.id,...it.practice.map(p=>p.id)].every(isDone)); li.querySelector(":scope>label").classList.toggle("checked",isDone(it.id));}
        it.practice.forEach(p=>{const pl=document.querySelector(`[data-pid="${p.id}"]`); if(pl){pl.classList.toggle("pdone",isDone(p.id)); pl.querySelector("label").classList.toggle("checked",isDone(p.id));}});
        const dl=document.querySelector(`.proj [data-pid="${it.id}"]`); if(dl){dl.classList.toggle("pdone",isDone(it.id)); dl.querySelector("label").classList.toggle("checked",isDone(it.id));}
      });
    });
  });
  const ap=pctOf(all);
  const a=document.querySelector("[data-alldone]"); if(a) a.textContent=ap;
  const ab=document.querySelector("[data-allbar]"); if(ab) ab.style.width=ap+"%";
}

function render(){
  renderTabs();
  if(current==="plan") renderPlan(); else renderRoadmap(data.find(r=>r.key===current));

}

view.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]"); if(go){current=go.dataset.go;render();window.scrollTo({top:0});return;}
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act;
  if(act==="expand") view.querySelectorAll("details.sec").forEach(d=>d.open=true);
  if(act==="collapse") view.querySelectorAll("details.sec").forEach(d=>d.open=false);
  if(act==="hide"){hideDone=!hideDone;b.setAttribute("aria-pressed",hideDone);document.getElementById("rmbody").classList.toggle("hide-done",hideDone);}
  if(act==="export"){
    const json=JSON.stringify({app:"fde-handbook",v:1,checked:state.checked,t:state.t});
    const filename="fde-progress-"+new Date().toISOString().slice(0,10)+".json";
    const plain=()=>{const blob=new Blob([json],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
    if(downloads){ downloads.save({filename,data:json}).catch(e=>{ if(e&&e.code!=="declined"&&e.code!=="rate_limited") alert("Export isn't available here. Open the downloaded handbook file to export."); }); }
    else plain();
  }
  if(act==="import"){
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
    inp.onchange=()=>{const f=inp.files&&inp.files[0]; if(!f) return;
      f.text().then(txt=>{
        let d; try{d=JSON.parse(txt);}catch(e){alert("That file isn't a progress export. Choose a file named fde-progress-….json.");return;}
        if(!d||typeof d.checked!=="object"){alert("That file isn't a progress export. Choose a file named fde-progress-….json.");return;}
        const n=Object.keys(d.checked).length;
        if(!confirm("Replace your current progress with the "+n+" ticked items in this file?")) return;
        state={checked:{...d.checked},t:Date.now()}; persistLocal(); scheduleRemote(); render();
      });
    };
    inp.click();
  }
});

render();
initRemote();
})();
</script>
</body></html>
